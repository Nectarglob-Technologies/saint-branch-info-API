name: Trigger auto deployment for saint-branch-data-info-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/saint-branch-data-info-app-AutoDeployTrigger-d790d390-bc20-45e1-bcb1-92a1f0752d9c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SAINTBRANCHDATAINFOAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SAINTBRANCHDATAINFOAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SAINTBRANCHDATAINFOAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: .
          dockerfilePath: ./Dockerfile
          registryUrl: saintbranchinforeg.azurecr.io
          registryUsername: ${{ secrets.SAINTBRANCHDATAINFOAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SAINTBRANCHDATAINFOAPP_REGISTRY_PASSWORD }}
          containerAppName: saint-branch-data-info-app
          resourceGroup: rg-public-apps
          imageToBuild: saintbranchinforeg.azurecr.io/saint-branch-data-info-acr:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_



